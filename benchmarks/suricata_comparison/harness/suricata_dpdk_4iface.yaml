%YAML 1.1
---
vars:
  address-groups: {HOME_NET: "any", EXTERNAL_NET: "any", DNS_SERVERS: "any", HTTP_SERVERS: "any", SQL_SERVERS: "any", SMTP_SERVERS: "any", TELNET_SERVERS: "any", DNP3_SERVER: "any", DNP3_CLIENT: "any", MODBUS_CLIENT: "any", MODBUS_SERVER: "any", ENIP_CLIENT: "any", ENIP_SERVER: "any", AIM_SERVERS: "any"}
  port-groups: {DNS_PORTS: "[9,53]"}
stats: {enabled: yes, interval: 3}
outputs: [ {stats: {enabled: yes, filename: stats.log, totals: yes, threads: yes}} ]
logging: {default-log-level: error, outputs: [ {console: {enabled: no}} ]}
default-rule-path: /home/sungwoo/suri_mt_test/rules
rule-files: [matchall.rules]
mpm-algo: hs
spm-algo: hs
threading:
  set-cpu-affinity: yes
  cpu-affinity:
    - management-cpu-set: {cpu: [ 0 ]}
    - worker-cpu-set: {cpu: [ 2, 3, 4, 5 ]}
dpdk:
  eal-params: {proc-type: primary, file-prefix: suri, socket-mem: "2048,0"}
  interfaces:
    - interface: 0000:3b:01.4
      threads: 1
      promisc: true
      checksum-checks: false
      checksum-checks-offload: false
      mtu: 1500
      mempool-size: 262143
      mempool-cache-size: 257
      rx-descriptors: 8192
      tx-descriptors: 8192
      copy-mode: none
    - interface: 0000:3b:01.5
      threads: 1
      promisc: true
      checksum-checks: false
      checksum-checks-offload: false
      mtu: 1500
      mempool-size: 262143
      mempool-cache-size: 257
      rx-descriptors: 8192
      tx-descriptors: 8192
      copy-mode: none
    - interface: 0000:3b:01.6
      threads: 1
      promisc: true
      checksum-checks: false
      checksum-checks-offload: false
      mtu: 1500
      mempool-size: 262143
      mempool-cache-size: 257
      rx-descriptors: 8192
      tx-descriptors: 8192
      copy-mode: none
    - interface: 0000:3b:01.7
      threads: 1
      promisc: true
      checksum-checks: false
      checksum-checks-offload: false
      mtu: 1500
      mempool-size: 262143
      mempool-cache-size: 257
      rx-descriptors: 8192
      tx-descriptors: 8192
      copy-mode: none
